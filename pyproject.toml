[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prompt-studio"
version = "0.3.0"
description = "Local prompt compiler with a Jev System-1 decision gate"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Swastik Bhat" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]


[tool.setuptools]
packages = ["prompt_studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
